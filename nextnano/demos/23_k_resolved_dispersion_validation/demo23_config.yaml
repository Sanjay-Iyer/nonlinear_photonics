demo:
  id: 23
  name: k_resolved_dispersion_validation
  title: Controlled k_parallel Dispersion Validation for Equation 2
  parent_demos: [20, 21, 22]

geometry:
  thick_well_nm: 7.1
  tunnel_barrier_nm: 1.8
  thin_well_nm: 2.9
  period_barrier_nm: 18.2
  total_period_nm: 30.0
  interface_model: linear_1nm
  grade_width_nm: 1.0
  quantum_region_padding_nm: 2.0

materials:
  barrier_al_fraction: 0.55
  well_al_fraction: 0.0
  temperature_K: 300.0
  substrate: GaAs
  growth_direction: "[1, 0, 0]"

mesh:
  active_spacing_nm: 0.05
  outer_spacing_nm: 0.5

kp8:
  number_of_electron_states: 6
  number_of_hole_states: 8
  output_state_count: 14
  production_direction: y
  directions:
    y: [0.0, 1.0, 0.0]
    yz45: [0.0, 0.7071067811865476, 0.7071067811865476]
  all_k_state_output: true

solver:
  threads: 1
  timeout_seconds_per_deck: 14400

state_tracking:
  minimum_overlap_score: 0.60
  minimum_assignment_margin: 0.15
  energy_tie_break_weight: 0.05
  fail_on_ambiguous_target: true

chi2:
  wavelength_min_nm: 400.0
  wavelength_max_nm: 1850.0
  wavelength_step_nm: 1.0
  target_wavelength_nm: 1550.0
  broadening_meV: 5.0
  r_e_hh_nm: 0.751
  n_periods_per_metre: 33333333.333333332
  nz_semantics: one_asymmetric_coupled_qw_period_per_30_nm
  wells_per_period_diagnostic: 2
  max_states_per_band: 2
  frozen_matrix_case_id: "04"
  frozen_matrix_source: demo_results/demo19/tables/demo19_master_results.csv

integration:
  production_convention: d2k_over_2pi_squared
  diagnostic_conventions: [bare_d2k]
  spin_degeneracy: 2
  lattice_constant_nm: 0.565325
  bz_edge_convention: legacy_pi_over_a
  bz_definition: "k_BZ = pi/a; kmax = fraction_of_bz * pi/a"
  fraction_of_bz: 0.10
  production_points: 301
  grid_convergence_points: [101, 201, 301]
  kmax_convergence_fractions: [0.05, 0.075, 0.10, 0.125]

dispersion:
  interpolation: pchip
  electron_fit_anchor_k0: true
  near_zone_center_fit_fraction: 0.50
  baseline_electron_mass_m0: 0.067
  baseline_heavy_hole_mass_m0: 0.112

validation:
  baseline_complex_absolute_tolerance_pm_per_V: 1.0e-9
  boss_hybrid_relative_spectrum_tolerance: 0.01
  k0_transition_tolerance_eV: 1.0e-12
  interpolation_node_tolerance_eV: 1.0e-12
  isotropy_absolute_tolerance_meV: 1.0
  convergence_relative_tolerance: 1.0e-3

plots:
  enabled: true
  dpi: 220

paths:
  results_root: demo_results/demo23
