---
demo_id: 11_paper_validation_interband_chi2_acqw
title: Paper validation — interband chi(2) of asymmetric coupled quantum wells
template: acqw_paper.in.j2

# =========================================================================
# Structure: Fig. 1a/1c of arXiv:2602.23246v1.
#   s = (7.1 - 2.9) / (7.1 + 2.9) = 0.42, total GaAs = 10 nm, period = 30 nm.
# Published values live in paper_targets.yaml with their provenance; the values
# here are the SIMULATION INPUTS, kept separate so a deliberate change to the
# model can never be mistaken for a change to the paper's claims.
# =========================================================================
scientific:
  thick_well_nm: 7.1
  thin_well_nm: 2.9
  tunnel_barrier_nm: 1.8
  # 18.2 nm of AlGaAs separates repeated coupled-QW sets; a single period is
  # simulated with half of it on each side, giving the 30 nm period exactly.
  period_barrier_nm: 18.2
  aluminum_fraction: 0.55
  temperature_K: 300
  # Linear composition ramp width for the graded-interface model. The paper
  # reports EDS gradients "mostly linear across 1 nm". Zero means abrupt.
  interface_grading_nm: 0.0

numerical:
  active_region_grid_spacing_nm: 0.10
  exterior_grid_spacing_nm: 0.25
  number_of_electron_states: 4
  number_of_hole_states: 4
  quantum_region_padding_nm: 6.0
  # Extra AlGaAs beyond half the period barrier, for domain convergence only.
  domain_padding_nm: 0.0

# =========================================================================
# Stage configuration. Each stage is a separate group of solver cases plus its
# own post-processing; see README.md.
# =========================================================================
analysis:
  quantum_region_name: acqw
  dipole_polarization_name: growth_z
  boundary_edge_fraction: 0.05
  # Envelopes within a band must be orthonormal to this tolerance, otherwise
  # chi(2) depends on where the z origin is placed. See _shared/chi2.py.
  orthonormality_tolerance: 1.0e-3
  # --- origin-independence check -----------------------------------------
  # chi(2) must not change when the z origin moves. Two tolerances, because one
  # cannot cover both regimes: a symmetric structure has chi(2) = 0 by parity,
  # so there the reference spectrum is pure rounding noise and a RELATIVE
  # residual is a division of noise by noise. Above the scale floor the relative
  # tolerance applies; at or below it, only the absolute one does. Neither
  # regime is exempt from being checked.
  maximum_origin_dependence: 1.0e-6          # relative, used above the floor
  origin_independence_absolute_tolerance: 1.0e-12
  # In relative-mode chi(2) units. The paper's structure sits near 1; a
  # symmetric structure comes out at ~1e-14. Anything under this floor is
  # numerically zero, not small. The margin is deliberately wide on both sides
  # -- nine orders below the real structure, five above the parity zero -- so no
  # case in this demo lands near the switchover, where a spectrum just above the
  # floor would be judged relatively on a residual that is still pure noise.
  origin_independence_scale_floor: 1.0e-9
  # Large enough that a genuine origin dependence cannot hide inside the
  # structure, and recorded with every result.
  origin_independence_shift_nm: 100.0
  # Stage 2 - numerical convergence.
  convergence:
    active_region_grid_spacing_nm: [0.20, 0.10, 0.05]
    domain_padding_nm: [0.0, 4.0, 10.0]
    quantum_region_padding_nm: [3.0, 6.0, 9.0]
    number_of_electron_states: [3, 4, 6]
    # Requesting more states from the solver does NOT widen Eq. 2's m,n,l sums:
    # that is governed by metric.max_states_per_band, which the paper fixes at 2.
    # The two knobs are swept separately and the state-count audit checks that
    # each one moves what it claims to. See scripts/audit_state_counts.py.
    chi2_max_states_per_band: [2, 3, 4]
    # Relative spread of peak |chi(2)| across the window sweep that still counts
    # as converged. The 2026-07-31 run came in at 0.95: going from two states
    # per band to three dropped the peak twentyfold, because at the design point
    # hh3 sits 1-3 meV from hh2. Windows that pull in an unbound state are
    # excluded from the comparison rather than counted against it.
    chi2_state_window_relative_tolerance: 0.05
    # k-parallel convergence is post-processing on the Stage 1 states.
    k_parallel_points: [24, 48, 96, 192]
    k_parallel_fraction_of_bz: [0.05, 0.10, 0.20]
    # Padding convergence repeated at the asymmetries where Stage 3 misbehaves,
    # rather than only at the design point. The 2026-07-31 licensed run showed
    # boundary probability riding the 1e-3 threshold at s = 0.55 while the
    # s = 0.42 padding scan looked clean, so a check at 0.42 alone proves
    # nothing about the rest of the sweep.
    padding_at_asymmetry:
      enabled: true
      asymmetry_values: [0.38, 0.42, 0.46, 0.50, 0.55]
      quantum_region_padding_nm: [3.0, 6.0, 9.0]
  # Stage 3 - asymmetry sweep at fixed 10 nm total well thickness.
  # Finer between 0.30 and 0.55, around the paper's predicted optimum of 0.42.
  # s = 1.0 exactly is a single 10 nm well, a different geometry rather than a
  # two-well structure; the paper's claim that chi(2) -> 0 there is checked
  # analytically instead (a symmetric structure gives identically zero, which is
  # unit-tested in test_demo11_paper_validation.py).
  asymmetry_sweep: [0.00, 0.10, 0.20, 0.30, 0.34, 0.38, 0.42, 0.46, 0.50,
                    0.55, 0.60, 0.70, 0.80, 0.90]
  # Stage 3b - refined sweep across the discontinuity the 2026-07-31 licensed
  # run exposed. Between s = 0.38 and s = 0.42 the peak |chi(2)| jumps by 8.5x
  # while <e2|hh2> collapses from 0.958 to 0.448 and E_hh2 turns around: the
  # signature of an avoided crossing being tracked by energy index. The coarse
  # sweep above is KEPT for context; this one resolves the cliff.
  asymmetry_sweep_refined: [0.36, 0.37, 0.38, 0.39, 0.40, 0.41, 0.42, 0.43,
                            0.44, 0.45, 0.46, 0.47, 0.48, 0.49, 0.50, 0.51,
                            0.52]
  # --- physical-state tracking across the refined sweep -------------------
  # Assigning "hh2" to the second energy-ordered state is exactly what breaks
  # at an avoided crossing. States are instead matched to their neighbours by
  # envelope overlap, and the two labellings are reported side by side.
  state_tracking:
    enabled: true
    # Below this best-match overlap an assignment is reported as ambiguous
    # rather than accepted.
    minimum_confidence: 0.60
    # Best minus second-best overlap. A small margin means two candidates fit
    # nearly equally well, which is what a crossing looks like.
    minimum_assignment_margin: 0.15
    # Energy continuity breaks ties only; it never overrides overlap.
    energy_continuity_weight: 0.05
    bands: [electron, heavy_hole]
  # Stage 4 - tunnelling-barrier sweep at fixed asymmetry and total thickness.
  barrier_sweep_nm: [0.5, 1.0, 1.5, 1.8, 2.0, 2.5, 3.0, 4.0, 5.0]
  # Stage 7 - interface abruptness.
  interface_models:
    - name: ideal_abrupt
      interface_grading_nm: 0.0
    - name: graded_1nm
      interface_grading_nm: 1.0

# =========================================================================
# chi(2) settings. Mode `relative` is the default and needs nothing the paper
# does not publish. See _shared/chi2.py for what each mode may claim.
# =========================================================================
metric:
  mode: relative
  broadening_meV: 5.0
  k_parallel_fraction_of_bz: 0.10
  k_parallel_points: 96
  lattice_constant_nm: 0.565325
  electron_mass_m0: 0.067
  heavy_hole_inplane_mass_m0: 0.112
  spin_degeneracy: 2
  # States of each band entering Eq. 2's m,n,l sums. The paper uses the first
  # two bound states of each band. This is INDEPENDENT of
  # numerical.number_of_electron_states, which only sets how many states the
  # solver returns; every artifact records both.
  max_states_per_band: 2
  # --- absolute mode: both MUST be supplied, and the paper publishes neither.
  # Leave null and the run stays in relative mode rather than inventing a scale.
  r_e_hh_nm: null
  n_wells_per_metre: null
  # --- calibrated mode: one global factor fitted to one published value.
  calibration_target_pm_per_V: 2340.0
  calibration_wavelength_nm: 1550.0
  calibration_source: >-
    arXiv:2602.23246v1 Section 3.1, simulated ideal-abrupt-interface chi(2) of
    2340 pm/V at 1550 nm fundamental
  # Stage 6 - wavelength ranges.
  broad_wavelength_nm: [400.0, 1800.0]
  broad_wavelength_points: 701
  focused_wavelength_nm: [1400.0, 1800.0]
  focused_wavelength_points: 401
  # The fundamental at which single-number comparisons are quoted.
  reference_wavelength_nm: 1550.0

outputs:
  parser_profile: nextnano_pp_3_0_0
  quantum_region_name: acqw
  polarizations: ["growth_z"]
  bandedge_columns:
    position_nm: 0
    conduction_eV: 1
    heavy_hole_eV: 2
    light_hole_eV: 3
    split_off_eV: 4
  write_csv: true
  write_plots: true

validation:
  completion_markers: ["simulation completed", "calculation successfully completed"]
  fatal_markers: ["terminating program", "fatal error", "license expired"]
  convergence_warning_markers: ["failed to converge"]
  minimum_confined_probability: 0.50
  maximum_boundary_probability: 0.001
  # What to do with a state that fails the bound-state criterion but is still
  # among the first max_states_per_band of its band:
  #   warn       - keep it in Eq. 2, flag the case (the behaviour every result
  #                to date was produced with, so it stays the default)
  #   exclude    - drop it from Eq. 2 and record why
  #   fail_case  - mark the case invalid
  # `exclude` changes which states Eq. 2 sums over and so changes the physics;
  # it is a deliberate experiment, not a cleanup. The active policy is named in
  # the validation report either way.
  quasi_bound_state_policy: warn
  normalization_tolerance: 0.001
  # Agreement required against the paper's stated transition energies, in meV.
  # This is a REPORTING threshold, not a target to tune material parameters to.
  transition_energy_tolerance_meV: 40.0
  absolute_energy_tolerance_meV: 1.0
  require_all_states_bound: false
