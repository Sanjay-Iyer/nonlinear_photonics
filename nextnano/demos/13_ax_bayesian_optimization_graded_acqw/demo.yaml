---
demo_id: 13_ax_bayesian_optimization_graded_acqw
title: "Demo 13 — Ax Bayesian Optimization of Graded Asymmetric Coupled Quantum Wells"
template: graded_acqw_bo.in.j2

demo:
  id: 13
  name: ax_bayesian_optimization_graded_acqw

# Everything below `baseline` through `metric` is inherited from Demo 12 so that
# a Demo 13 trial and a Demo 12 case with the same geometry are the same physical
# calculation. Demo 11 extraction, chi(2), QC and origin-independence are reused
# unchanged; only the *search* is new.
baseline:
  source_demo: 12_graded_interface_coupled_quantum_well_optimization
  reference_case: t00
  physics_demo: 11_paper_validation_interband_chi2_acqw
  inheritance_note: >-
    GaAs/Al0.55Ga0.45As coupled wells with 10.0 nm total well material,
    18.2 nm period barrier, 300 K, Gamma+HH one-band model, four states,
    5 meV broadening, 1550 nm reference, Demo 11 Eq. 2 relative chi(2),
    Demo 12 centered grading geometry, extraction, QC, corrected origin test,
    and bound-state policy.

scientific:
  thick_well_nm: 7.1
  thin_well_nm: 2.9
  tunnel_barrier_nm: 1.8
  period_barrier_nm: 18.2
  aluminum_fraction: 0.55
  temperature_K: 300
  interface_grading_nm: 0.0

numerical:
  # v3: halved from 0.10 nm. The thinnest barrier v3 searches is 0.85 nm, which
  # at 0.10 nm is 8 mesh cells; at 0.05 nm it is 17. A barrier is not a grade and
  # receives no local refinement, so this is the only lever on its resolution.
  # Consequence: v3 observations are NOT comparable with v2's, which were
  # computed at 0.10 nm, and no v2 observation may warm-start v3.
  active_region_grid_spacing_nm: 0.05
  exterior_grid_spacing_nm: 0.25
  number_of_electron_states: 4
  number_of_hole_states: 4
  quantum_region_padding_nm: 6.0
  domain_padding_nm: 0.0

workflow:
  # synthetic_smoke_test | demo12_replay | prepare_candidates |
  # run_pending_candidates | closed_loop | analyze_existing_results |
  # validate_top_designs
  #
  # closed_loop: v3 is a NEW campaign and this mode SPENDS LICENSED SOLVER TIME.
  # It proposes, runs and completes trials until the budget below is exhausted.
  #
  # To reanalyse the completed v2 study instead, set
  #   mode: analyze_existing_results
  #   experiment_state_dir: demo13_ax_experiment_v2
  # which calls no solver and opens that experiment read-only.
  mode: closed_loop
  resume: true
  # Directory (under the results root) holding the Ax snapshot and the immutable
  # trial ledger. Kept outside any single run directory so a run never destroys
  # optimization history.
  #
  # v3 is a fresh experiment in its own directory. v2 is never modified, reused
  # or resumed: its search space differs (barrier lower bound, minimum resolvable
  # grade, active mesh) and `experiment_schema.json` now records all three, so a
  # v2 snapshot loaded under this configuration is refused rather than silently
  # reinterpreted.
  experiment_state_dir: demo13_ax_experiment_v3
  experiment_name: demo13_graded_acqw_bo

simulation:
  # This gate can only ever DISABLE the solver. A machine without a complete
  # licensed nextnano++ setup still skips execution with run_solver: true.
  run_solver: true
  threads: 4

bo:
  library: ax
  # Pinned in requirements.txt; demo13 refuses to run against an untested major.
  required_ax_version: "1.3.1"
  minimum_ax_version: "1.0.0"
  api: ax.api.client.Client

  # target_wavelength (Mode A) | intrinsic_peak (Mode B) |
  # multi_objective (Mode C) | weighted_score (optional secondary mode)
  optimization_mode: target_wavelength
  target_wavelength_nm: 1550
  random_seed: 17

  num_initial_trials: 6
  num_iterations: 10
  batch_size: 1

  checkpoint_after_each_trial: true
  retry_failed_trials: false
  # Ax generation-strategy method: quality | fast | random_search.
  generation_method: fast
  # Ax places one trial at the search-space centre when true. Left false so the
  # initial design is the requested Sobol quasi-random set and nothing else.
  initialize_with_center: false

  # A requested BO iteration means one VALID model-based evaluation, not one raw
  # Ax proposal. A proposal rejected by geometry preflight or as a canonical
  # duplicate never reaches nextnano and never consumes an iteration; a
  # replacement is requested within the same iteration, up to the attempt limit.
  max_candidate_regeneration_attempts: 20
  invalid_preflight_counts_as_bo_iteration: false
  duplicate_counts_as_bo_iteration: false
  prevent_resuggestion_of_rejected_candidates: true

  search_space:
    # hierarchical: an `interface_mode` tree parameter makes abrupt designs
    #   structurally free of grading parameters, so a duplicate abrupt geometry
    #   cannot be proposed under five different profile labels.
    # flat: the four-parameter form; abrupt designs are canonicalized to
    #   0 nm grading and deduplicated explicitly.
    encoding: hierarchical

    # thickness -> Ax searches grading_thickness_nm in nm directly. Whether a
    #   value is constructible depends on the barrier and well widths of the
    #   same candidate, so over-wide grades ARE proposable and must be rejected
    #   by preflight. Premium trials 4 and 12 were lost this way.
    # fraction  -> Ax searches grading_fraction_of_feasible_max in [0, 1] and
    #   the realized width is that fraction of the largest constructible grade
    #   for the geometry being proposed. An impossible grade becomes
    #   unproposable rather than merely detectable.
    #
    # Changing this changes the Ax search space, so an experiment checkpointed
    # under one value cannot be resumed under the other. demo13 refuses to load
    # a mismatched snapshot and tells you how to proceed.
    parameterization: fraction
    grading_fraction_of_feasible_max:
      # v3: raised from 0.05. The largest grade this geometry can build is the
      # central barrier minus `grading.minimum_flat_region_nm`, so at the widest
      # barrier (2.5 nm) the maximum is ~2.4 nm and a fraction of 0.35 realizes
      # ~0.84 nm -- just above the resolvable minimum. A lower bound of 0.05
      # would spend most proposals on grades the mesh cannot resolve, each of
      # which is rejected and regenerated.
      lower: 0.35
      upper: 1.0

    # v3: raised from 0.10 nm. This is the COLLAPSE threshold -- at or below it a
    # design is canonicalized to abrupt -- and it must never sit below the
    # physical minimum below it, or a grade narrower than the mesh can resolve
    # would be taught to the surrogate as a real graded design. That is exactly
    # what v2 did, and it is why v2 cannot say whether grading helps.
    minimum_graded_thickness_nm: 0.80

    # The narrowest grade this mesh and profile implementation can actually
    # build, derived in EXPERIMENT_V3_DESIGN.md: 16 staircase sublayers over
    # 0.80 nm is 0.05 nm each, matched by 32 grid points across the grade
    # (0.025 nm spacing) so every sublayer is sampled at least twice.
    #
    # NOTE: because the largest constructible grade is (central barrier -
    # minimum_flat_region_nm), a 0.80 nm grade needs a barrier of at least
    # 0.90 nm. Between the 0.85 nm barrier lower bound and 0.90 nm the graded
    # branch is EMPTY: only abrupt designs are constructible there. Those
    # proposals are rejected with a reason naming this, cost a regeneration
    # attempt and no BO iteration, and never reach the solver.
    minimum_mesh_resolvable_nonzero_grading_nm: 0.80

    # A graded proposal realizing below the minimum is rejected and regenerated
    # rather than quietly canonicalized to abrupt. A design that realizes 0 nm
    # is still *classified* as abrupt everywhere downstream -- hashing, plots,
    # tables, profile evidence -- because that is what it physically is.
    reject_subresolution_grades: true
    deduplicate_canonical_designs: true
    duplicate_tolerance:
      asymmetry_s: 1.0e-4
      central_barrier_thickness_nm: 1.0e-3
      grading_thickness_nm: 1.0e-3

    asymmetry_s:
      type: range
      lower: 0.36
      upper: 0.56

    central_barrier_thickness_nm:
      type: range
      # v3: raised from 0.5 nm. v2's winner sat exactly on the old bound, which
      # is an optimizer reporting that the bound binds, not an interior optimum.
      # 0.85 nm is 3 monolayers of AlGaAs (a = 0.565325 nm, so 1 ML along [001]
      # is 0.2827 nm); 0.5 nm was 1.77 ML, not a growable layer, and comparable
      # to the interdiffusion length. At the 0.05 nm mesh above, 0.85 nm spans
      # 17 cells.
      lower: 0.85
      upper: 2.5

    grading_thickness_nm:
      type: range
      lower: 0.0
      upper: 3.0

    grading_profile:
      type: choice
      values:
        - abrupt
        - linear
        - sigmoid
        - erf
        - cosine

  # Section 5 extensions. Every entry stays out of the search space until its
  # `enabled` flag is true, so the default study remains four-dimensional.
  optional_parameters:
    grading_location:
      enabled: false
      type: choice
      values: [all, outer_only, central_only, left_only, right_only]
    outer_interface_grading_thickness_nm:
      enabled: false
      type: range
      lower: 0.0
      upper: 3.0
    central_interface_grading_thickness_nm:
      enabled: false
      type: range
      lower: 0.0
      upper: 3.0
    grading_asymmetry_ratio:
      enabled: false
      type: range
      lower: 0.5
      upper: 2.0
    maximum_aluminum_fraction:
      enabled: false
      type: range
      lower: 0.30
      upper: 0.70
    narrow_well_nm:
      enabled: false
      type: range
      lower: 2.0
      upper: 4.0
    wide_well_nm:
      enabled: false
      type: range
      lower: 6.0
      upper: 8.5

  objectives:
    target_wavelength:
      maximize: [relative_chi2_at_target_wavelength_abs]
    intrinsic_peak:
      maximize: [relative_peak_chi2_abs]
    multi_objective:
      maximize: [relative_peak_chi2_abs, relative_chi2_at_target_wavelength_abs, robustness_score]
      minimize: [absolute_detuning_nm]
    weighted_score:
      maximize: [weighted_score]
      weights:
        relative_peak_chi2_abs: 0.25
        relative_chi2_at_target_wavelength_abs: 0.30
        absolute_detuning_nm: 0.15
        robustness_score: 0.20
        state_tracking_confidence: 0.10

  # Which constraints Ax is TOLD about, as opposed to which are enforced.
  #
  # Every constraint below is evaluated on every trial regardless. This section
  # only controls what enters the Gaussian-process model. The 2026-07-31
  # licensed run showed why it must be controlled: constraining a metric whose
  # observations sit on (or negligibly far from) its own threshold makes BoTorch
  # report every observation infeasible, and it began doing so exactly when the
  # first genuinely feasible design appeared. See AX_FEASIBILITY_ANALYSIS.md.
  #
  # Defaults: binary 0/1 validity flags are never modelled; continuous metrics
  # that vary meaningfully are. Override only with evidence.
  outcome_modelling:
    never_model:
      # Constant at ~3e-7 against a 1e-3 bound: passes by four orders of
      # magnitude, so its standardized slack is indistinguishable from zero.
      - orthonormality_error
    always_model: []

  # Ax outcome constraints. Bounds are taken from the repository tolerances in
  # `analysis`, `validation` and `bound_states` below, not chosen independently.
  # `maximum_detuning_nm` binds `absolute_detuning_nm`; the signed detuning is
  # reported everywhere and constrained nowhere.
  outcome_constraints:
    maximum_detuning_nm: 15.0
    maximum_boundary_probability: 1.0e-3
    minimum_state_tracking_confidence: 0.80
    maximum_orthonormality_error: 1.0e-3
    require_origin_independence: true
    require_expected_states: true
    require_physical_qc: true

  warm_start:
    # v3: OFF. `require_matching_physics_keys` includes
    # numerical.active_region_grid_spacing_nm, which moved from 0.10 to 0.05 nm,
    # so every prior observation is disqualified anyway. Turning it off states
    # that plainly rather than relying on the filter to empty itself. Two
    # calculations of the same design at different mesh spacings are not
    # observations of the same function, and attaching them would teach the
    # surrogate that one design has two different answers.
    use_demo12_warm_start: false
    # Demo 12 stages whose cases share Demo 13's parameterization exactly.
    compatible_stages: [stage2, stage3, stage5]
    require_matching_physics_keys:
      - scientific.aluminum_fraction
      - scientific.period_barrier_nm
      - scientific.temperature_K
      - numerical.active_region_grid_spacing_nm
      - numerical.number_of_electron_states
      - numerical.number_of_hole_states
      - metric.mode
      - metric.broadening_meV
      - metric.max_states_per_band
    require_valid_qc: true
    maximum_observations: 12
    source_run_dir: null

  surrogate_slices:
    grid_points: 25
    # Held-fixed coordinates for a slice. Each key must name a parameter the
    # search space ACTUALLY has: under `parameterization: fraction` there is no
    # `grading_thickness_nm` to hold fixed, and 1.5 is not even a legal value of
    # the fraction that replaced it. A key that names no live parameter is
    # ignored, which is how a slice silently reverted to its default.
    fixed_values:
      asymmetry_s: 0.46
      # v3: lowered from 1.8 nm. v2's slices were cut at 1.8 nm while its optimum
      # was at 0.5 nm, so every partial-dependence curve ran through a region the
      # optimizer had abandoned. 1.2 nm is near the thin end of the v3 range and
      # still wide enough for a resolvable grade (max = 1.2 - 0.1 = 1.1 nm).
      central_barrier_thickness_nm: 1.2
      # Dimensionless, in [0.35, 1.0]. NOT nanometres. The realized width is this
      # fraction of the largest grade the candidate's geometry can build, and is
      # reported next to it in every slice CSV.
      grading_fraction_of_feasible_max: 0.8
      grading_profile: linear

validation_study:
  enabled: true
  top_designs: 3
  local_refinement:
    asymmetry_s: [-0.02, 0.02]
    central_barrier_thickness_nm: [-0.2, 0.2]
    grading_thickness_nm: [-0.25, 0.25]
  mesh_convergence_nm: [0.05, 0.10]
  state_count_convergence: [4, 6]
  domain_padding_nm: [0.0, 4.0]
  fabrication_perturbations:
    narrow_well_nm: [-0.2, 0.2]
    wide_well_nm: [-0.2, 0.2]
    central_barrier_nm: [-0.2, 0.2]
    grading_thickness_nm: [-0.25, 0.25]
    aluminum_fraction: [-0.01, 0.01]

grading:
  enabled: true
  implementation: native
  fallback_implementation: staircase
  profile: linear
  location_mode: all
  selected_thickness_nm: 0.0
  preserve_total_device_length: true
  preserve_nominal_layer_centers: true
  preserve_nominal_well_width: true
  # Flat material each layer must retain outside every centred grade. Defaults
  # to one active-mesh cell: a "layer" thinner than the grid is not resolvable.
  minimum_flat_region_nm: 0.10
  # Realized grade widths are snapped down onto this increment before the deck
  # is rendered, so the canonical design hash is taken on the geometry that is
  # actually built. 0 disables snapping.
  mesh_snap_nm: 0.01
  # v3: raised from 10. Demo 12 refines *inside* a grade to honour this, leaving
  # the baseline mesh untouched elsewhere, so this is cheap. 32 points across the
  # narrowest 0.80 nm grade is 0.025 nm spacing, which samples each of the 16
  # staircase sublayers (0.05 nm) twice. At 10 points the spacing would be
  # 0.08 nm -- coarser than a sublayer, so a sigmoid, erf or cosine grade would
  # have been rendered as a staircase the grid could not see.
  minimum_grid_points_per_grade: 32
  staircase_sublayers: 16
  sigmoid_steepness: 10.0
  erf_span_sigma: 3.0
  upward_thickness_nm: 1.5
  downward_thickness_nm: 2.5
  center_shift_nm: 0.0
  interface_shift_nm: 0.0
  native_profiles: [abrupt, linear, asymmetric]
  definition: >-
    Inherited verbatim from Demo 12: the grading thickness is the full
    start-to-end transition width, centered on the nominal abrupt interface,
    replacing equal lengths of the adjacent well and barrier at fixed layer
    centers and fixed total device length.

locations:
  outer_interfaces: true
  central_barrier_interfaces: true
  study_modes: [none, outer_only, central_only, left_only, right_only, all]

state_tracking:
  enabled: true
  # Trials are scattered, not gridded: each new design is assigned against its
  # nearest already-completed neighbour in normalized parameter space.
  method: nearest_neighbour_overlap_assignment
  minimum_confidence: 0.60
  minimum_assignment_margin: 0.15
  energy_continuity_weight: 0.05
  ambiguity_threshold: 0.15
  align_arbitrary_sign: true
  anchor_case: reference_abrupt
  save_complete_assignment_matrices: true
  parameter_scales:
    asymmetry_s: 0.20
    central_barrier_thickness_nm: 2.0
    grading_thickness_nm: 3.0

physical_qc:
  # warn       -> trial stays usable, reported as valid_with_warning, and the
  #               named failing test stays visible. Never a clean pass.
  # constraint -> defer to the continuous maximum_boundary_probability
  #               constraint, which Ax already models. Same physics, one voice.
  # reject     -> scientifically_invalid: metrics kept, excluded from ranking,
  #               Ax trial abandoned so the surrogate is not taught this region
  #               scores well.
  # fail_trial -> treated as a mechanical failure; no objective given to Ax.
  bound_state_policy: warn

bound_states:
  policy: warn
  maximum_boundary_probability: 1.0e-3
  boundary_edge_fraction: 0.05

chi2:
  reference_wavelength_nm: 1550.0
  integrated_wavelength_nm: [1400.0, 1800.0]
  integrated_wavelength_points: 401
  bandwidth_fraction_of_peak: 0.5
  report_peak_metric: true
  report_reference_metric: true
  report_integrated_metric: true

paper_comparison:
  enabled: true
  source: "arXiv:2602.23246v1 Figure 2d (eye-digitized; visual reference only)"
  digitized_simulation_csv: paper_figure2d_digitized_simulation.csv
  measured_intensity_csv: null
  units: normalized
  full_range_nm: [1200.0, 1800.0]
  telecom_range_nm: [1450.0, 1650.0]
  claim_policy: >-
    Digitized values are never used as optimization targets, calibration data,
    or exact validation ground truth.

analysis:
  quantum_region_name: acqw
  dipole_polarization_name: growth_z
  boundary_edge_fraction: 0.05
  orthonormality_tolerance: 1.0e-3
  maximum_origin_dependence: 1.0e-6
  origin_independence_absolute_tolerance: 1.0e-12
  origin_independence_scale_floor: 1.0e-9
  origin_independence_shift_nm: 100.0

metric:
  mode: relative
  broadening_meV: 5.0
  k_parallel_fraction_of_bz: 0.10
  k_parallel_points: 96
  lattice_constant_nm: 0.565325
  electron_mass_m0: 0.067
  heavy_hole_inplane_mass_m0: 0.112
  spin_degeneracy: 2
  max_states_per_band: 2
  r_e_hh_nm: null
  n_wells_per_metre: null
  calibration_target_pm_per_V: 2340.0
  calibration_wavelength_nm: 1550.0
  calibration_source: "Demo 11 / arXiv:2602.23246v1; calibrated mode is never called independent reproduction"
  broad_wavelength_nm: [400.0, 1800.0]
  broad_wavelength_points: 701
  focused_wavelength_nm: [1400.0, 1800.0]
  focused_wavelength_points: 401
  reference_wavelength_nm: 1550.0

outputs:
  parser_profile: nextnano_pp_3_0_0
  quantum_region_name: acqw
  polarizations: [growth_z]
  bandedge_columns: {position_nm: 0, conduction_eV: 1, heavy_hole_eV: 2, light_hole_eV: 3, split_off_eV: 4}
  write_csv: true
  write_plots: true

validation:
  completion_markers: [simulation completed, calculation successfully completed]
  fatal_markers: [terminating program, fatal error, license expired]
  convergence_warning_markers: [failed to converge]
  minimum_confined_probability: 0.50
  maximum_boundary_probability: 1.0e-3
  quasi_bound_state_policy: warn
  normalization_tolerance: 1.0e-3
  transition_energy_tolerance_meV: 40.0
  absolute_energy_tolerance_meV: 1.0
  require_all_states_bound: false
  grading_thickness_tolerance_nm: 0.05
  composition_endpoint_tolerance: 1.0e-4
  integrated_composition_relative_tolerance: 1.0e-3
  native_staircase_composition_rms_tolerance: 0.02
  native_staircase_bandedge_tolerance_meV: 5.0

reporting:
  make_figures: true
  export_csv: true
  export_json: true
  export_markdown: true
  export_pdf: true
  raw_points_only: true
  minimal_plot_text: true
  write_guides: true
