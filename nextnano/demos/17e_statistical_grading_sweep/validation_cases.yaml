demo: 17e_statistical_grading_sweep
purpose: One fixed paper-geometry ACQW solved 21 times -- once with ideal abrupt interfaces
  and twenty times with seed-locked random interface grading widths -- to measure
  how STEM/EDS-scale interface roughness moves the absolute second-order susceptibility.
reference_structure_identical_to: 17_paper_chi2_reproduction_corrected case_02
total_cases: 21
deterministic: true
optimization_performed: false
sampling:
  seed: 17005
  realizations: 20
  distribution: truncated_normal
  mean_nm: 0.7
  standard_deviation_nm: 0.3
  minimum_nm: 0.2
  maximum_nm: 1.4
  interface_standard_deviation_nm: 0.08
  round_to_decimals: 4
  tie_rule: mean_of_same_chemistry
  maximum_rise_tie_residual_nm: 0.6
  model: 'hierarchical: one truncated-normal run-level width per realization, plus
    an independent normal offset per interface'
  interfaces_in_draw_order:
  - gaas_to_algaas_barrier
  - algaas_to_gaas_well
  - gaas_to_algaas_cladding
  rise_interfaces:
  - gaas_to_algaas_barrier
  - gaas_to_algaas_cladding
  fall_interfaces:
  - algaas_to_gaas_well
  uniform_source: random.Random(seed) -- Mersenne Twister, stdlib
  inverse_cdf_source: statistics.NormalDist -- exact, stdlib
  draws_per_realization: 4
grading_profile: linear
grading_families_supported:
- linear
reference_case: case_00
paper_target_case: case_00
paper_target_pm_per_V: 2340.0
fixed_structure:
  well: GaAs
  barrier: AlGaAs
  aluminium_fraction: 0.55
  asymmetry_s: 0.41999999999999993
  central_barrier_nm: 1.8
  total_gaas_well_nm: 10.0
  mesh_nm: 0.05
  target_wavelength_nm: 1550.0
abrupt_sentinel_width_nm: 0.001
severity_bands:
- key: sharp
  label: Sharp (< 0.5 nm)
  upper_nm: 0.5
- key: moderate
  label: Moderate (0.5 - 0.9 nm)
  lower_nm: 0.5
  upper_nm: 0.9
- key: severe
  label: Severe (> 0.9 nm)
  lower_nm: 0.9
realized_statistics:
  mean_interface_grading_width:
    count: 20
    min_nm: 0.290675
    mean_nm: 0.8049424999999999
    median_nm: 0.8201999999999999
    max_nm: 1.1405750000000001
    stdev_nm: 0.25335601876296737
  run_level_width:
    count: 20
    min_nm: 0.2674
    mean_nm: 0.8214750000000001
    median_nm: 0.8530500000000001
    max_nm: 1.1926
    stdev_nm: 0.26615819964232196
  per_sampled_interface:
    gaas_to_algaas_barrier:
      count: 20
      min_nm: 0.4329
      mean_nm: 0.8207150000000001
      median_nm: 0.8513
      max_nm: 1.2385
      stdev_nm: 0.24934253817210025
    algaas_to_gaas_well:
      count: 20
      min_nm: 0.2
      mean_nm: 0.79168
      median_nm: 0.8586
      max_nm: 1.1564
      stdev_nm: 0.2669760714686657
    gaas_to_algaas_cladding:
      count: 20
      min_nm: 0.2997
      mean_nm: 0.8156950000000001
      median_nm: 0.82595
      max_nm: 1.2632
      stdev_nm: 0.2642259011069685
  severity_counts:
    sharp: 3
    moderate: 10
    severe: 7
  rise_tie_residual_nm:
    max: 0.15105000000000002
    mean: 0.043870000000000006
  narrowest_ramp_mesh_cells: 5.0
