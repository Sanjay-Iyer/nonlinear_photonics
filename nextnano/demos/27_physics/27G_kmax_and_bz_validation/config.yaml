demo:
  id: 27G
  slug: kmax_and_bz_validation
  title: kmax and Brillouin-zone convention validation
  question: What does the paper's "one tenth of the Brillouin zone" physically correspond to?
  tier: 2
  tier_planned: 2
  priority: 3
  professional_required: true
  prerequisites: []
  unlocks: []

pass_condition: >-
  The chi2 spectrum is computed out to at least 0.2 pi/a, and every spectral
  feature is classified as either STABLE (its position stops moving as kmax
  grows) or CUTOFF ARTIFACT (its position tracks the zone-edge transition
  energy). Demo 24 already showed that the model's own 1250-1450 nm structure is
  the second kind: it marched 1502 -> 1431 -> 1376 -> 1318 nm as kmax went 0.05
  -> 0.125 pi/a and tracked 2hc/DeltaE(kmax) to 9 nm, while the two real peaks
  moved less than 1 nm. PASS means every feature carries that label out to the
  Gamma-X reading of the paper's cutoff.

# Why this sub-demo exists. The repository defines k_BZ = pi/a, so production
# kmax = 0.1 pi/a = 0.5557 /nm. For zincblende along [010], Gamma-X is 2pi/a, so
# "0.1 of Gamma-X" - and equally "0.1 of a reciprocal lattice vector" - is
# 0.2 pi/a, twice the cutoff every result so far has used. The paper does not
# state its convention. Demo 26 ranks this hypothesis 2 of 15.
bz_conventions_tested:
  - {name: pi_over_a, fraction: 0.10, note: "the existing Demo 20-23 convention; already computed"}
  - {name: pi_over_a, fraction: 0.15, note: "intermediate point, to see the trend rather than two endpoints"}
  - {name: gamma_x,   fraction: 0.10, note: "0.1 |Gamma-X| = 0.2 pi/a - the competing reading"}
  - {name: pi_over_a, fraction: 0.30, note: "past both readings, to prove saturation rather than assume it"}

cost:
  decks: 3
  k_points_per_deck: 451
  states_per_deck: 14
  runtime_hours: [1.0, 3.0]
  output_gb: [0.8, 2.5]
  basis: >-
    Demo 23 measured 301 k points x 14 states at 10 min 20 s, i.e. about 2 s per
    k point. The k spacing is held at the Demo 23 value, so widening the range
    widens the point count proportionally: 451, 601 and 901 points for 0.15, 0.20
    and 0.30 pi/a. That is roughly 2000 k-point solves, or 1-3 h with margin.
    Only three decks are new: 0.10 pi/a is demo_results/demo23/raw/
    production_y_n301_k0100 and 0.125 pi/a is kmax_y_n301_k0125, both already
    computed on this exact structure.

stages:
  preflight: {kind: generate_and_parse}
  physics:   {kind: professional}
  analyze:   {kind: python}

controlled_change:
  summary: >-
    The in-plane cutoff only. The k-point count moves with it so that the k
    spacing stays at the Demo 23 value - widening the range while holding the
    point count fixed would confound a cutoff effect with a sampling effect, and
    Demo 24 has already shown this spectrum is sensitive to both.
  fields: [relative_size, kmax_per_nm, k_points]
  max_fields_per_deck: 3

decks:
  - name: bz_0p15_pi_over_a
    question: Intermediate cutoff - does the 1250-1450 nm feature keep marching?
    overrides: {fraction_of_bz: 0.15, bz_convention: pi_over_a, k_points: 451}
  - name: bz_0p10_gamma_x
    question: The competing reading of the paper - 0.1 |Gamma-X| = 0.2 pi/a
    overrides: {fraction_of_bz: 0.10, bz_convention: gamma_x, k_points: 601}
  - name: bz_0p30_pi_over_a
    question: Past both readings - has the response actually saturated?
    overrides: {fraction_of_bz: 0.30, bz_convention: pi_over_a, k_points: 901}

harvest_overrides: {}

analysis:
  produces:
    - KMAX_FEATURE_STABILITY.csv
    - CUMULATIVE_CHI2_VS_KMAX.csv
    - ARTIFACT_VS_PHYSICAL_FEATURES.csv
    - BZ_CONVENTION_VERDICT.md
