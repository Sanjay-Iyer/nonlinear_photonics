demo:
  id: 27I
  slug: solver_model_cross_validation
  title: Solver and model cross-validation
  question: Which spectral features come specifically from the 8-band k.p treatment?
  tier: 1
  tier_planned: "2-3"
  tier_note: >-
    Planned as Tier 2-3. The single-band arm has no k dependence to compute and
    finishes in seconds; the kp6 arm solves 6 bands instead of 8 over the same
    path. Against the reused kp8 arm from Demo 23 this is well inside Tier 1.
  priority: 9
  professional_required: true
  prerequisites: []
  unlocks: []

pass_condition: >-
  The same physical structure is solved with three models and the state energies,
  transition energies and optical matrix elements are tabulated side by side.
  PASS means each of the six Equation 2 features is attributed to the simplest
  model that reproduces it. The comparison must be like-for-like: the geometry,
  mesh, temperature and domain are identical across arms, which is exactly what
  the single controlled change guarantees.

cost:
  decks: 2
  k_points_per_deck: 301
  states_per_deck: 14
  runtime_hours: [0.1, 0.5]
  output_gb: [0.1, 0.5]
  basis: >-
    The single-band arm is an ordinary 1D Schroedinger solve on 600 grid points
    and takes seconds. The kp6 arm is the Demo 23 production cost scaled by
    roughly (6/8), i.e. minutes. The kp8 arm is not rerun: it is
    demo_results/demo23/raw/production_y_n301_k0100 on this exact structure.

stages:
  preflight: {kind: generate_and_parse}
  physics:   {kind: professional}
  analyze:   {kind: python}

controlled_change:
  summary: >-
    The quantum model. The single-band deck also drops the k path, because a
    decoupled Gamma/HH model has no in-plane k dependence to sample in this deck
    form - that is the second field, and it is a consequence of the first rather
    than an independent choice.
  fields: [band_model, k_mode]
  max_fields_per_deck: 2

decks:
  - name: model_kp6_valence
    question: Which features survive a 6-band valence treatment with a decoupled conduction band?
    overrides: {band_model: kp6}
  - name: model_single_band
    question: Which features survive a decoupled parabolic Gamma/HH treatment?
    overrides: {band_model: single_band, k_mode: none}

harvest_overrides: {}

analysis:
  produces:
    - MODEL_STATE_ENERGIES.csv
    - MODEL_MATRIX_ELEMENTS.csv
    - FEATURE_MODEL_ATTRIBUTION.csv
    - MODEL_VERDICT.md
