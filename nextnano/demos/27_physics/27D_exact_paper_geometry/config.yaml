demo:
  id: 27D
  slug: exact_paper_geometry
  title: Exact paper geometry - abrupt interfaces versus 1 nm grading
  question: Does the paper's abrupt-interface structure reproduce the spectrum better than our 1 nm graded structure?
  tier: 2
  tier_planned: 2
  priority: 2
  professional_required: true
  prerequisites: []
  unlocks: [27E]

pass_condition: >-
  The abrupt structure is solved with everything else held at the Demo 23
  baseline, and the six Equation 2 features (P1 540, Z1 605, P2 760, P3 1080,
  Z2 1330, P4 1520 nm) are located in the normalized |chi2| for both structures
  and compared against the digitized paper curve. PASS means the comparison is
  made and the answer is stated either way. A result showing grading is NOT the
  explanation is a pass, and demotes hypothesis 1 in the Demo 26 ranking.

cost:
  decks: 1
  k_points_per_deck: 301
  states_per_deck: 14
  runtime_hours: [0.15, 0.5]
  output_gb: [0.3, 1.0]
  basis: >-
    One deck identical in cost to the Demo 23 production run (301 k points, 14
    states, 10 min 20 s measured on the work laptop), plus margin. Only one deck
    is needed because the graded arm ALREADY EXISTS: demo_results/demo23/raw/
    production_y_n301_k0100 is this exact structure and solver configuration, so
    rerunning it would buy nothing. See REUSE_AUDIT.md.

stages:
  preflight: {kind: generate_and_parse}
  physics:   {kind: professional}
  analyze:   {kind: python}

controlled_change:
  summary: >-
    The interface model, and nothing else. Layer widths, Al fractions, mesh,
    temperature, state count, k range and k sampling are the Demo 23 baseline, so
    the only thing that can move a spectral feature is the interface abruptness.
    The geometry is NOT optimized here; 27D asks whether the paper's structure
    explains the disagreement, not which structure fits best.
  fields: [interface_model]
  max_fields_per_deck: 1

decks:
  - name: abrupt_paper_geometry
    question: Does the ideal abrupt structure move P1/Z1/P2/P3/Z2/P4 towards the paper?
    overrides:
      interface_model: abrupt

harvest_overrides: {}

analysis:
  produces:
    - GEOMETRY_FEATURE_COMPARISON.csv
    - NORMALIZED_CHI2_SPECTRA.csv
    - GEOMETRY_VERDICT.md
