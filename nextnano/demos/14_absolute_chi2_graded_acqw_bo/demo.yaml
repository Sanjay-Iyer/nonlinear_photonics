# Demo 14 -- absolute chi(2) in pm/V + graded GaAs/AlGaAs ACQW Bayesian
# optimization at 1550 nm.
#
# Everything a researcher is expected to change lives here. Changing Python
# should never be necessary to move the target, the ranges, the trial count,
# the mesh, the k grid or the solver timeout.
#
# Demo 14 is a BETA campaign. The absolute scale rests on two constants the
# source paper does not publish jointly (r_e_hh is published; the N_z counting
# convention is ambiguous), so every pm/V number carries that caveat.

experiment:
  name: demo14_absolute_chi2_graded_acqw
  demo_id: 14_absolute_chi2_graded_acqw_bo
  description: >-
    Grading-only Bayesian optimization of |chi2_xzx| at a 1550 nm fundamental in
    graded GaAs/Al0.55Ga0.45As asymmetric coupled quantum wells, with the
    susceptibility reported as an absolute value in pm/V rather than a relative
    arbitrary-unit merit.

# --- materials -------------------------------------------------------------
materials:
  well: GaAs
  barrier: Al(x)Ga(1-x)As
  substrate: GaAs
  # Fixed for the Demo 14 beta campaign. Demo 15 optimizes it instead.
  barrier_al_fraction: 0.55
  temperature_K: 300.0

# --- geometry --------------------------------------------------------------
geometry:
  # Fixed total GaAs well thickness; asymmetry redistributes it between wells:
  #   d_thick = D (1 + s) / 2,  d_thin = D (1 - s) / 2
  # Demo 15 frees this; Demo 14 holds it at the paper value on purpose.
  total_well_thickness_nm: 10.0
  period_barrier_nm: 18.2
  # Outer material beyond the active region.
  domain_padding_nm: 20.0
  quantum_region_padding_nm: 2.0

# --- grading ---------------------------------------------------------------
grading:
  # The optimizer-facing width is a 10-90% transition width, so the same number
  # means the same physical interface for every family.
  width_definition: 10_90_percent_of_transition
  # Primary realized-width reference. "peak" stays defined when two interfaces
  # overlap and the barrier never reaches nominal composition; "nominal" is
  # recorded beside it and is null in exactly that case.
  realized_width_reference: peak
  nominal_reference_low_fraction: 0.10
  nominal_reference_high_fraction: 0.90
  # Continuous oversampling used to quantify what the simulation mesh lost.
  continuous_oversample: 20
  render:
    linear: ternary_linear      # native nextnano++
    fermi: ternary_import       # Python-generated x_Al(x)
    erf: ternary_import
    cosine: ternary_import
  growth_coordinate: x
  import_name: al_profile

# --- nextnano++ ------------------------------------------------------------
nextnano:
  template: graded_acqw14.in.j2
  parser_profile: nextnano_pp_3_0_0
  quantum_region_name: acqw
  dipole_polarization_name: growth_z
  bandedge_columns:
    position_nm: 0
    conduction_eV: 1
    heavy_hole_eV: 2
    light_hole_eV: 3
    split_off_eV: 4
  # Finite and generous. A production ACQW solve is seconds to minutes; an hour
  # means something has hung, and an unattended campaign must not wait forever.
  solver_timeout_seconds: 3600
  threads: 1

# --- mesh ------------------------------------------------------------------
mesh:
  active_region_grid_spacing_nm: 0.05
  outer_grid_spacing_nm: 0.5

# --- states ----------------------------------------------------------------
states:
  number_of_electron_states: 6
  number_of_hole_states: 6
  output_state_count: 6
  # Eq. 2 uses the first two bound states of each band. Raising this changes
  # what is being computed and is a deliberate convergence experiment.
  max_states_per_band: 2

# --- absolute chi(2) -------------------------------------------------------
chi2:
  mode: absolute
  target_wavelength_nm: 1550.0
  broadening_meV: 5.0
  max_states_per_band: 2

  # Bloch interband POSITION matrix element <u_e|r|u_hh>, 7.51 Angstrom.
  # Ramesh et al., Appl. Phys. Lett. 123, 251111 (2023), VASP/HSE06.
  # Eq. (3) already carries e^3 -- this is never multiplied by the charge.
  r_e_hh_nm: 0.751

  # N_z is "the number of QWs per unit length" (Ramesh 2023 Eq. 1), which does
  # not distinguish a coupled pair from its two wells. period_density is the
  # primary reading; the alternative is reported as a sensitivity, never fitted.
  nz_mode: period_density
  reference_period_nm: 30.0     # 18.2 + 7.1 + 1.8 + 2.9
  wells_per_period: 2
  n_wells_per_metre: null       # null -> derived from nz_mode and the period

  broad_wavelength_nm: [400.0, 1800.0]
  broad_wavelength_points: 701
  focused_wavelength_nm: [1400.0, 1800.0]
  focused_wavelength_points: 401

# --- in-plane integration --------------------------------------------------
k_parallel:
  fraction_of_bz: 0.10
  points: 96
  # Named rather than embedded: the papers say "one-tenth of the Brillouin
  # zone" without stating which edge, and the choice multiplies the k measure.
  zone_edge_convention: legacy_pi_over_a
  lattice_constant_nm: 0.565325
  electron_mass_m0: 0.067
  heavy_hole_inplane_mass_m0: 0.112
  # Kept separate from N_z on purpose; one paper conflates them.
  spin_degeneracy: 2
  convergence:
    enabled: true
    point_counts: [48, 96, 192, 384]
    relative_tolerance: 1.0e-3

# --- optimization ----------------------------------------------------------
optimization:
  library: ax
  required_ax_version: "1.3.1"
  minimum_ax_version: "1.0.0"

  objective: chi2_xzx_abs_at_1550_pm_per_V
  direction: maximize

  # 30 COMPLETED solver trials, not 30 proposals.
  target_completed_trials: 30
  initialization_trials: 10
  bo_trials: 20
  batch_size: 1
  random_seed: 1414

  # Every grading family must receive initial observations, or a family can look
  # bad merely for having been sampled less.
  stratify_initialization_by_profile: true
  minimum_initial_per_profile: 2

  search_space:
    asymmetry_s:
      type: range
      lower: 0.30
      upper: 0.55
    nominal_central_barrier_thickness_nm:
      type: range
      lower: 0.85
      upper: 2.50
    gaas_to_algaas_grading_width_10_90_nm:
      type: range
      lower: 0.40
      upper: 1.40
    algaas_to_gaas_grading_width_10_90_nm:
      type: range
      lower: 0.40
      upper: 1.40
    grading_profile:
      type: choice
      # No abrupt branch: Demo 14 is a grading study.
      values: [linear, fermi, erf, cosine]

  max_candidate_regeneration_attempts: 20

# --- constraints -----------------------------------------------------------
constraints:
  maximum_detuning_nm: 40.0
  maximum_boundary_probability: 1.0e-3
  minimum_state_tracking_confidence: 0.80
  maximum_orthonormality_error: 1.0e-3
  require_origin_independence: true
  require_expected_states: true
  require_physical_qc: true
  require_absolute_units_valid: true
  require_k_parallel_converged: false   # reported; not a feasibility gate in beta

# --- failure policy --------------------------------------------------------
failure_policy:
  # A physically unfavourable trial is a result. An infrastructure failure is a
  # bug, and continuing past it would spend licensed time proving it 29 more
  # times.
  stop_on_technical_failure: true
  # Demo 14 is feasible by construction, so this should never fire. If it does,
  # the parameterization is broken and the run must stop and say so loudly.
  subresolution_grade_is_a_bug: true
  fabricate_objective_for_failed_trials: false

# --- logging ---------------------------------------------------------------
logging:
  console_level: INFO
  file_level: DEBUG
  events_jsonl: true
  timing_jsonl: true
  intermediate_plot_every_n_trials: 5

# --- checkpointing ---------------------------------------------------------
checkpointing:
  after_every_trial: true
  atomic_writes: true
  keep_per_trial_snapshots: true

# --- plotting --------------------------------------------------------------
plotting:
  enabled: true
  # A cosmetic failure must never destroy a completed licensed campaign.
  failure_is_fatal: false
  dpi: 150
  formats: [png]

# --- paper reference -------------------------------------------------------
paper_reference:
  enabled: true
  targets_file: ../11_paper_validation_interband_chi2_acqw/paper_targets.yaml
  structure:
    thick_well_nm: 7.1
    tunnel_barrier_nm: 1.8
    thin_well_nm: 2.9
    period_barrier_nm: 18.2
    al_fraction: 0.55
    asymmetry_s: 0.42
  # Validation targets, never fit targets.
  expectations:
    chi2_ideal_abrupt_pm_per_V: 2340.0
    chi2_eds_al_profile_pm_per_V: 1200.0
    chi2_eds_ga_profile_pm_per_V: 1363.0
    simulated_resonance_nm: 1520.0
  # Order-of-magnitude plausibility only. A miss is recorded and reported; it
  # does not silently rescale anything.
  plausibility_band_pm_per_V: [50.0, 50000.0]

# --- licensed startup gate -------------------------------------------------
startup_gate:
  enabled: true
  # The home laptop's free build cannot execute ternary_import at all, so this
  # is the first thing the licensed machine must prove.
  import_equivalence:
    enabled: true
    profile: linear
    barrier_thickness_nm: 1.8
    grading_width_10_90_nm: 1.0
    tolerances:
      electron_energy_eV: 1.0e-3
      hole_energy_eV: 1.0e-3
      chi2_relative: 0.02
      overlap_absolute: 5.0e-3
  paper_reference:
    enabled: true
  # Both gates must pass before the 30-trial campaign may be launched.
  require_gate_before_campaign: true

# --- workflow / paths ------------------------------------------------------
workflow:
  mode: closed_loop
  run_solver: true
  # Mock mode is for harness testing only and is never the production default.
  mock_solver: false

paths:
  results_subdir: 14_absolute_chi2_graded_acqw_bo
