        constant recalibrated against the measured 104-character output tail.
    pending_licensed_checks:
      - Re-run with the shortened case identifiers and confirm all 24 complete.
      - Confirm no ranked candidate carries an exclusion reason.
      - Investigate why 8 of the 12 successful candidates were excluded from the
