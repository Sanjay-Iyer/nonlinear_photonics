---
# Machine-readable state of the nextnano++ learning sequence.
#
# `status` vocabulary (see _shared/registry.py):
#   failed               a run was attempted and did not succeed
#   syntax_unverified    the deck has never been accepted by any nextnano++ parser
#   implemented_dry_run  inputs generate and validate; no solver has seen them
#   licensed_run_pending syntax accepted somewhere, licensed execution still owed
#   solver_passed        the licensed solver ran the deck to completion
#   parser_passed        ... and this repository parsed its real output
#   physically_validated ... and every numerical/physical check in the demo passed
#
# Only `physically_validated` licenses describing a demo's PHYSICS as trustworthy.
#
# `home_syntax_check` / `home_solver_check` record what the home laptop's Free
# nextnano++ 3.0.0 could establish. The Free edition parses the full grammar but
# executes only small (<= 100 grid point) 1D decks at 300 K with Gamma/HH bands
# and no strain and no k.p, so it can confirm plumbing but never Standard physics.

schema: 1

demos:

  01_classical_single_quantum_well:
    title: Classical GaAs/AlGaAs single quantum well
    status: physically_validated
    depends_on: []
    introduces:
      - 1D grid and layer regions
      - alloy composition and interfaces
      - classical Gamma/HH/LH/SO band edges
    home_syntax_check: parsed_free_3_0_0
    home_solver_check: not_attempted_grid_too_large_for_free
    licensed_validation:
      date: "2026-07-30"
      solver: "nextnano++ 3.0.0 (2026-06-16 kernel)"
      evidence: >-
        deck accepted, Gamma/HH/LH/SO band edges written, finished with DONE,
        and repository validation completed successfully after the mandatory
        neutral-contact correction.
    pending_licensed_checks: []
    unvalidated_syntax: []

  02_one_band_finite_quantum_well:
    title: One-band finite GaAs/AlGaAs quantum well
    status: physically_validated
    depends_on: [01_classical_single_quantum_well]
    introduces:
      - one-band Gamma electron Schroedinger equation
      - eigenenergies, envelopes, probability densities
      - physical (not ordinal) bound-state classification
    home_syntax_check: parsed_free_3_0_0
    home_solver_check: refused_free_edition_grid_limit
    licensed_validation:
      date: "2026-07-30"
      solver: "nextnano++ 3.0.0"
      evidence: >-
        licensed run established the installed output layout
        (energy_spectrum_k00000.dat, combined probabilities_k00000.dat,
        bandedges.dat columns x/Gamma/HH/LH/SO/Fermi levels), which fixed the
        parser in commit c3804af. The rerun then reported solver and scientific
        validation completed successfully.
    pending_licensed_checks: []
    unvalidated_syntax: []

  03_quantum_well_convergence:
    title: GaAs/AlGaAs finite-well numerical convergence
    status: physically_validated
    depends_on: [02_one_band_finite_quantum_well]
    introduces:
      - grid, domain, quantum-region and state-count sweeps
      - coarsest-acceptable-grid recommendation logic
    home_syntax_check: parsed_free_3_0_0
    home_solver_check: refused_free_edition_grid_limit
    licensed_validation:
      date: "2026-07-30"
      solver: "nextnano++ 3.0.0"
      evidence: >-
        All 16 grid/domain/quantum-region/state-count cases completed with
        solver and scientific validation. The recommendation selected a
        0.25 nm grid and 10 nm domain padding; E1 and E2 differed from their
        reference cases by less than 0.05 meV, well probability was about
        0.9695, and boundary probability was about 4.5e-8.
    pending_licensed_checks: []
    unvalidated_syntax: []

  04_symmetric_double_quantum_well:
    title: Symmetric double quantum well and tunnelling
    status: physically_validated
    depends_on: [02_one_band_finite_quantum_well, 03_quantum_well_convergence]
    introduces:
      - two coupled identical wells and a tunnelling barrier
      - symmetric/antisymmetric parity classification from envelopes
      - per-well localisation and overlap-based state tracking
    home_syntax_check: parsed_free_3_0_0
    home_solver_check: executed_free_3_0_0_reduced_grid
    licensed_validation:
      date: "2026-07-30"
      solver: "nextnano++ 3.0.0"
      run_id: "20260730T205056Z_56b2b6c0"
      evidence: >-
        All 11 production-grid cases completed with no solver failures.
        The symmetric/antisymmetric splitting decreased monotonically from
        35.2928 meV at a 1 nm centre barrier to 6.1312e-5 meV at 20 nm.
        The lowest pair retained symmetric/antisymmetric parity with left/right
        imbalance below 2.1e-9, while E1 and E2 changed by only 3.28e-5 and
        4.21e-5 meV when the quantum-region padding doubled.
    pending_licensed_checks: []
    unvalidated_syntax: []

  05_asymmetric_coupled_quantum_well_field:
    title: Asymmetric coupled quantum well with electric-field tuning
    status: parser_passed
    depends_on: [04_symmetric_double_quantum_well]
    introduces:
      - structural asymmetry between the two wells
      - an imposed electrostatic tilt via poisson{ electric_field{} }
      - field-driven localisation, avoided crossings, dipole <z>
    home_syntax_check: parsed_free_3_0_0
    home_solver_check: executed_free_3_0_0_reduced_grid
    licensed_validation:
      date: "2026-07-30"
      solver: "nextnano++ 3.0.0"
      run_id: "20260730T205153Z_6523ef84"
      evidence: >-
        All 19 cases completed and real Standard output parsed successfully.
        The requested field, electric_field.dat, potential slope, and band-edge
        tilt agreed across both polarities. Envelope-overlap state tracking was
        confident and one candidate avoided crossing was found near -35 kV/cm.
        At -75 and -100 kV/cm a higher excited state exceeded the boundary
        threshold, while the lowest tracked pair remained below 8e-6. The core
        crossing still requires the newly added padding/grid controls before
        physical validation.
    pending_licensed_checks:
      - Re-confirm on Standard that poisson{ electric_field{ strength } } is V/m.
      - Re-confirm the sign convention (positive strength along +x raises Ec with x).
      - Confirm avoided-crossing flags survive a padding and grid recheck.
    unvalidated_syntax: []

  06_self_consistent_doped_coupled_well:
    title: Doped coupled quantum well with self-consistent Schroedinger-Poisson
    status: licensed_run_pending
    depends_on: [05_asymmetric_coupled_quantum_well_field]
    introduces:
      - donors, ionized impurities, and classical Poisson
      - electron occupation and the Fermi level
      - staged A-E progression to self-consistent quantum-Poisson
    home_syntax_check: parsed_free_3_0_0
    home_solver_check: executed_free_3_0_0_reduced_grid
    licensed_validation:
      date: "2026-07-30"
      solver: "nextnano++ 3.0.0"
      evidence: >-
        all 11 cases executed, none failed. Stage B bent the conduction band
        66.5 meV more than the undoped Stage A; self-consistency (D) shifted E1
        by 18.7 meV relative to the non-self-consistent D->C comparison; the
        doping sweep raised the sheet density 2.9e11 -> 1.67e12 cm^-2 and the
        occupied subband count 2 -> 3, with charge balancing to better than
        2e-12 relative at every point. Two configuration bugs were found and
        fixed: an unreachable solver residual criterion, and outer barriers too
        thin for the third state at high doping.
    pending_licensed_checks:
      - Re-run with solver_residual_density_cm2 = 1e3 and confirm the coupled
        loop now reports convergence before the iteration cap.
      - Re-run with 30 nm outer barriers and confirm the third bound state's
        boundary probability drops below 1e-3 at 1e19 cm^-3.
    unvalidated_syntax: []

  07_strained_ingaas_gaas_6band:
    title: Strained InGaAs/GaAs quantum well, one-band versus 6-band valence
    status: licensed_run_pending
    depends_on: [03_quantum_well_convergence]
    introduces:
      - pseudomorphic strain on a GaAs substrate
      - HH/LH splitting from biaxial strain
      - 6-band valence k.p and component-weight state classification
    home_syntax_check: parsed_free_3_0_0
    home_solver_check: refused_free_edition_no_strain_no_kp
    licensed_validation:
      date: "2026-07-30"
      solver: "nextnano++ 3.0.0"
      evidence: >-
        every deck was accepted and executed (all wrote job_done.txt), but 13 of
        14 cases then failed in this repository's parser because the guessed
        strain filename was wrong. The error listing established the real names:
        Strain/strain_simulation.dat and strain_crystal.dat, kp6/ as the 6-band
        sub-directory, spinor_composition_k00000_CbHhLhSo.dat alongside an
        _SXYZ twin, and envelopes_k00000_SXYZ.dat. Those are now confirmed in
        the parser profile. No physics has been checked yet.
    pending_licensed_checks:
      - Re-run with the corrected parser profile and confirm all 14 cases parse.
      - Confirm the component column order inside strain_simulation.dat.
      - Confirm the column layout of spinor_composition_k00000_CbHhLhSo.dat.
      - Confirm HH and LH are degenerate in M1 and split in M2.
    unvalidated_syntax:
      - the component column order inside Strain/strain_simulation.dat
      - the column layout inside spinor_composition_k00000_CbHhLhSo.dat

  08_eight_band_interband_optics:
    title: Eight-band k.p interband optical transitions
    status: solver_passed
    depends_on: [07_strained_ingaas_gaas_6band]
    introduces:
      - 8-band k.p with coupled conduction and valence bands
      - interband transition energies and polarisation-resolved matrix elements
      - selection rules and symmetry-suppressed transitions
    home_syntax_check: parsed_free_3_0_0
    home_solver_check: refused_free_edition_no_kp
    licensed_validation:
      date: "2026-07-30"
      solver_version: "nextnano++ 3.0.0"
      solver_cases_completed: 13
      parser_result: >-
        Original parser failed after solver completion because [eV] was
        separated from the transition column name as unit metadata.
      confirmed_paths:
        - Quantum/qw/Gamma_HH
        - Quantum/qw/Gamma_kp6
        - Quantum/qw/kp8
        - Quantum/qw/kp8_kp8
      scientific_finding: >-
        KP8 momentum_matrix_elements are envelope-momentum diagnostics; the
        TE_inplane component was identically zero and cannot substitute for
        the interband optical response.
    pending_licensed_checks:
      - Rerun with optics{ quantum_spectra{} } and confirm absorption output paths.
      - Confirm nonzero TE/TM solver absorption in cm^-1.
      - Confirm k-parallel sampling converges the spectrum.
    unvalidated_syntax:
      - optics{ quantum_spectra{} } absorption output filename in nextnano++ 3.0.0

  09_three_level_nonlinear_optics_sweep:
    title: Automated three-level nonlinear-optics design sweep
    status: licensed_run_pending
    depends_on:
      - 03_quantum_well_convergence
      - 05_asymmetric_coupled_quantum_well_field
    introduces:
      - single-variable, two-variable, and design-list sweeps
      - solver-reported and envelope-derived position matrix elements
      - a documented RELATIVE design metric that is explicitly not chi(2)
    home_syntax_check: parsed_free_3_0_0
    home_solver_check: executed_free_3_0_0_reduced_grid
    licensed_validation:
      date: "2026-07-30"
      solver: "nextnano++ 3.0.0"
      evidence: >-
        12 of 24 cases completed and every validation criterion passed on them,
        including the solver-dipole versus envelope-integral cross-check and the
        refined-mesh reruns (E21 moved 0.06 meV; the relative metric moved 0.2%
        and 1.5%). The other 12 died with exit code 4294967295 purely because
        their case directory names pushed the output path past the 259-character
        Windows limit -- one failing case had parameters identical to a case
        that succeeded. Case identifiers have been shortened and the path-budget
        constant recalibrated against the measured 104-character output tail.
    pending_licensed_checks:
      - Re-run with the shortened case identifiers and confirm all 24 complete.
      - Confirm no ranked candidate carries an exclusion reason.
      - Investigate why 8 of the 12 successful candidates were excluded from the
        ranking (likely the E21/E32 constraint window).
    unvalidated_syntax: []

  10_first_2d_quantum_confinement:
    title: First 2D quantum-confinement model
    status: licensed_run_pending
    depends_on: [03_quantum_well_convergence, 04_symmetric_double_quantum_well]
    introduces:
      - simulate2D with an x-y mesh and rectangle regions
      - 2D probability densities, slices, and symmetry diagnostics
      - mesh-anisotropy, domain-padding, and grid-alignment tests
    home_syntax_check: parsed_free_3_0_0
    home_solver_check: refused_free_edition_1d_only
    licensed_validation:
      date: "2026-07-30"
      solver: "nextnano++ 3.0.0"
      evidence: >-
        2D execution works: all 25 decks were accepted and ran to completion.
        24 then failed in this repository's parser on an ambiguous
        probabilities glob (the solver writes both probabilities_k00000.fld and
        probabilities_shift_k00000.fld). The run established that 2D output is
        binary AVS/Express .fld, that dim1 varies fastest so a variable
        reshapes to (ny, nx), and that bandedges.fld uses its own 2n-2 doubled
        grid rather than the quantum grid. Re-analysed against the committed
        fixture the baseline gives E21 = 30.16 meV, a density integrating to 1
        within 1e-15, a centroid exactly at the core centre, zero boundary
        probability, and symmetry errors of 1.5e-15 and 2.3e-15.
    pending_licensed_checks:
      - Re-run with the corrected .fld reader and confirm all 25 cases parse.
      - Confirm the mesh, anisotropy, padding, and alignment sweeps converge.
      - Confirm the wide-wire limit approaches the 1D reference result.
    unvalidated_syntax:
      - the integer-to-material encoding inside Structure/material_indices.txt
        (read from the legend file rather than assumed, but seen for only one
        structure so far)

  11_paper_validation_interband_chi2_acqw:
    title: Paper validation of the interband chi(2) of asymmetric coupled wells
    status: implemented_dry_run
    depends_on:
      - 05_asymmetric_coupled_quantum_well_field
      - 07_strained_ingaas_gaas_6band
      - 08_eight_band_interband_optics
      - 09_three_level_nonlinear_optics_sweep
    introduces:
      - reproduction of a published coupled-quantum-well structure
      - "the paper's Eq. 2 interband chi(2) in relative/absolute/calibrated modes"
      - graded versus abrupt interface comparison
      - a formal classified paper-comparison report
      - "two separately reported chi(2) metrics: intrinsic peak versus fixed-wavelength"
      - physical-state tracking across a sweep by envelope overlap
      - "a six-level reproduction-status vocabulary distinct from the classification"
    home_syntax_check: parsed_free_3_0_0
    home_solver_check: refused_free_edition_grid_limit
    licensed_validation:
      2026-07-31:
        commit: d1aed8ddc8fa83f5c07ead081319890ed0e5e0e6
        cases: 38
        outcome: all_completed
        reproduced:
          - "E1-HH1 = 1.48906 eV against the published 1.49 eV"
          - "E2-HH2 = 1.62967 eV against the published 1.62 eV"
          - "focused-scan peak at 1519 nm against the published ~1520 nm"
          - "barrier optimum at 1.0 nm, under both chi(2) metrics"
          - "graded/abrupt ratio 0.571 against the published 0.513"
        exposed:
          - "false origin-independence FAIL at the s = 0 parity zero: the relative
             residual divided ~1e-14 of noise by a 5.7e-14 scale"
          - "the asymmetry optimum was scored at a fixed 1550 nm across a sweep whose
             resonance moves ~100 nm; on the intrinsic peak metric it is s = 0.50,
             ahead of s = 0.55 by only 0.4%"
          - "chi(2)(s) jumps by a factor of 8.5 between s = 0.38 and s = 0.42 while
             <e2|hh2> collapses 0.958 -> 0.448 and E_hh2 reverses: an avoided crossing
             followed by energy index"
          - "state-count convergence was vacuous: the sum is capped at
             max_states_per_band regardless of how many states the solver returns"
      2026-07-31b:
        commit: 5ace1dcf28a6dc7f3c24062e7709ae61164821dc
        cases: 73
        outcome: all_completed
        resolved:
          - "origin independence now PASSES at the s = 0 parity zero, on an absolute
             residual of ~8e-15 against a 1e-12 tolerance"
          - "state-count propagation audited PASS at every layer: requested [3,4,6]
             reaches extraction, and the sum stays capped at max_states_per_band"
          - "the chi(2)(s) discontinuity is NOT a labelling artifact. Physical-state
             tracking reordered nothing across all 17 refined points (0 ambiguous,
             raw and tracked chi(2) identical everywhere)"
        exposed:
          - "Eq. 2's two-state truncation is NOT converged at the paper's design point:
             2 -> 3 states per band drops peak |chi(2)| 1.090 -> 0.0546 (20x) and moves
             the resonance 1519 -> 1461 nm. hh3 sits 1-3 meV from hh2 at s = 0.42. The
             4-state window is excluded: it pulls in an unbound state."
          - "the refined sweep localises the cliff to s = 0.39 -> 0.40, a 15.5x step in
             one 0.01 increment, coinciding with the hh2-hh3 gap minimum of 1.37 meV.
             The apparent optimum at s = 0.41 is the top of an anticrossing spike."
          - "padding does NOT converge at s = 0.55 (1.3e-3 -> 1.9e-3 -> 1.0e-3 for
             3/6/9 nm); that state is genuinely quasi-bound in a 2.25 nm thin well.
             It converges cleanly at s = 0.38, 0.42, 0.46 and 0.50."
    pending_licensed_checks:
      - "Eq. 2 state-window convergence is FAILED, not merely unverified. Enlarge the
         quantum region so a 4+ state window contains only bound states, then rerun the
         window sweep. No chi(2)-scan number, including the ~1520 nm resonance, can be
         called converged until it stops moving."
      - "Stage 3 - the asymmetry optimum stays provisionally_consistent. The refined
         sweep did not settle it; it showed the local maximum is an anticrossing
         artifact of the same truncation."
      - "Decide whether the paper's own two-state Eq. 2 is being applied outside its
         range of validity at s ~ 0.42, or whether the near-degenerate hh3 contribution
         genuinely cancels. This is a physics question, not a numerics one."
    unvalidated_syntax:
      - "structure/region/ternary_linear{} graded-alloy output: parse-validated only, no licensed run has produced its composition profile yet"

  12_graded_interface_coupled_quantum_well_optimization:
    title: Graded-interface coupled quantum-well robustness and optimization
    status: implemented_dry_run
    depends_on:
      - 11_paper_validation_interband_chi2_acqw
    introduces:
      - native linear and staircase alloy grading with requested-versus-realized profile validation
      - grading thickness, shape, and interface-location studies
      - bidirectional physical-state tracking over asymmetry and grading thickness
      - fabrication finite-difference robustness analysis
      - constrained Pareto optimization with separate peak and target-wavelength chi(2) objectives
      - three explicitly gated solver-cost tiers
    home_syntax_check: input_generation_only
    home_solver_check: not_attempted_no_licensed_solver
    licensed_validation: null
    pending_licensed_checks:
      - Run the four-case Tier A smoke manifest and inspect output_alloy_composition.
      - Confirm ternary_linear native profiles and staircase profiles realize their requested endpoints and thicknesses.
      - Confirm native/staircase energy, band-edge, and wavefunction agreement.
      - Run mesh convergence before Tier B scientific interpretation.
      - Run bidirectional state tracking before accepting an optimum near the avoided crossing.
      - Quantify robustness and compare with the accepted Demo 11 abrupt reference.
    unvalidated_syntax:
      - nextnano++ 3.0.0 licensed output path and column layout for output_alloy_composition

  13_ax_bayesian_optimization_graded_acqw:
    title: Ax Bayesian optimization of graded asymmetric coupled quantum wells
    status: implemented_dry_run
    depends_on:
      - 12_graded_interface_coupled_quantum_well_optimization
      - 11_paper_validation_interband_chi2_acqw
    introduces:
      - Ax 1.3.1 Client API closed-loop Bayesian optimization over the Demo 12 design space
      - hierarchical interface_mode search space so abrupt designs carry no grading parameters
      - YAML-controlled initial-trial and BO-iteration counts with expected-evaluation reporting
      - snapshot checkpointing after every generated and completed trial, and exact resume
      - mechanical solver failure reported as an Ax failed trial, never as objective zero
      - physical-validity rejection through explicit Ax outcome constraints
      - nearest-neighbour physical state tracking across scattered (non-gridded) trials
      - Demo 12 warm-start ingestion with recorded compatibility provenance
      - synthetic known-optimum recovery and Demo 12 replay against random and grid search
    home_syntax_check: input_generation_only
    home_solver_check: not_attempted_no_licensed_solver
    licensed_validation: null
    pending_licensed_checks:
      - Run the Stage 3 licensed smoke study (few initial trials, 2-3 BO iterations, batch size 1) before any long run.
      - Confirm every trial's realized alloy profile against its requested profile, as in Demo 12 Stage 1.
      - Confirm the closed loop completes, checkpoints, and resumes across a deliberate interruption.
      - Confirm failed solver trials are reported to Ax as failed and never as a zero objective.
      - Run Stage 5 local refinement, mesh, state-count and padding convergence on the top designs before calling any Ax optimum validated.
      - Re-check state tracking near avoided crossings before accepting an optimum.
    unvalidated_syntax:
      - inherits Demo 12's unvalidated ternary_linear/ternary_constant alloy-composition output layout
