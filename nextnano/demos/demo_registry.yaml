  13_ax_bayesian_optimization_graded_acqw:
    title: Ax Bayesian optimization of graded asymmetric coupled quantum wells
    # 2026-08-01: the v3 licensed campaign completed on the work laptop -- 23
    # proposals, 7 refused at preflight with no solver launched, 16 completed
    # with zero mechanical failures, 3 feasible, best feasible t0021. That is a
    # real licensed run, so implemented_dry_run understates it. It is NOT
    # physical validation: Stage 5 mesh, state-count, padding, refinement and
    # robustness checks have not run, and t0021's barrier sits on the 0.85 nm
    # lower search bound. (An earlier v2 campaign, best t0012 at a 0.5 nm bound
    # and a 0.10 nm mesh, is superseded and not comparable -- see below.)
    status: licensed_optimization_completed_validation_pending
    depends_on:
      - 12_graded_interface_coupled_quantum_well_optimization
      - 11_paper_validation_interband_chi2_acqw
    introduces:
      - Ax 1.3.1 Client API closed-loop Bayesian optimization over the Demo 12 design space
      - hierarchical interface_mode search space so abrupt designs carry no grading parameters
      - YAML-controlled initial-trial and BO-iteration counts with expected-evaluation reporting
      - snapshot checkpointing after every generated and completed trial, and exact resume
      - mechanical solver failure reported as an Ax failed trial, never as objective zero
      - physical-validity rejection through explicit Ax outcome constraints
      - nearest-neighbour physical state tracking across scattered (non-gridded) trials
      - Demo 12 warm-start ingestion with recorded compatibility provenance
      - synthetic known-optimum recovery and Demo 12 replay against random and grid search
    home_syntax_check: input_generation_only
    home_solver_check: not_attempted_no_licensed_solver
    licensed_validation:
      date: "2026-08-01"
      solver: "nextnano++ Standard (work laptop)"
      evidence: >-
        Experiment v3 (schema demo13-search-space-3, 0.05 nm mesh, 0.85-2.5 nm
        barrier): 23 proposals, 7 refused at preflight as sub-resolution grades
        with no solver launched, 16 completed with zero mechanical failures
        (6 Sobol + 10 model-based), 3 feasible, best feasible trial t0021.
        Solver execution, extraction, QC, Ax completion and checkpoint/resume are
        exercised for real. This validates the PLUMBING only. The objective is a
        RELATIVE nonlinear-optical merit in arbitrary units, never calibrated
        chi(2) in pm/V. t0021 sits on the 0.85 nm barrier lower bound and has not
        passed Stage 5, so it is a best-found design and not a validated optimum.
        The campaign was run from a DIRTY work-laptop tree, so the recorded commit
        does not fully describe the code that produced it.
      superseded: >-
        Experiment v2 (0.5 nm barrier bound, 0.10 nm mesh, best t0012) is a
        separate earlier campaign under a different search space. Its numbers are
        not comparable with v3's and must not be quoted for v3.
    pending_licensed_checks:
      - Run Stage 5 mesh convergence on t0021 first (0.025 / 0.05 / 0.10 nm) and stop if the objective, detuning, state identity or QC is unstable.
      - Run Stage 5 local refinement, state-count and padding convergence on t0021, t0017, t0005 and t0022 before calling any design validated.
      - Re-check state tracking with an order-independent anchor; t0021 sits at the 0.85 nm barrier lower bound where tunnel coupling is strongest.
      - Confirm every trial's realized alloy profile against its requested profile; the v3 bundle carried no alloy-composition output, so no grading realization has been verified.
      - Answer whether grading helps with a balanced paired campaign. v3 evaluated five genuinely graded designs (erf 3, sigmoid 1, cosine 1, linear 0) and none was feasible, so the present data cannot decide it.
    unvalidated_syntax:
      - inherits Demo 12's unvalidated ternary_linear/ternary_constant alloy-composition output layout

  14_absolute_chi2_graded_acqw_bo:
    title: Absolute chi(2) in pm/V with graded-interface Bayesian optimization
    # Demo 14 advances Demo 13's RELATIVE arbitrary-unit merit to an ABSOLUTE
    # susceptibility in pm/V, and replaces the 16-sublayer staircase with
    # continuous composition profiles. The absolute model itself is the Demo 11
    # implementation in _shared/chi2.py running in mode: absolute -- what Demo 14
    # adds is the two constants it needs, an independent cross-check of both the
    # unit formulation and the k-space quadrature, and a production run harness.
    #
    # NOT YET LICENSED-VALIDATED. Three of the four grading families reach
    # nextnano++ through ternary_import, a path no nextnano++ instance in this
    # project has executed: the free home build parses such decks and then
    # refuses them. The licensed startup gate exists precisely to close that gap
    # before the campaign spends 30 trials on it.
    status: licensed_run_pending
    depends_on:
      - 13_ax_bayesian_optimization_graded_acqw
      - 11_paper_validation_interband_chi2_acqw
    introduces:
      - absolute chi(2) reported in pm/V using the Ramesh Eq. 3 prefactor, never a relative merit
      - r_e_hh = 0.751 nm (7.51 Angstrom, VASP/HSE06) verified verbatim from Ramesh 2023
      - N_z from a named counting convention with the period/well ambiguity reported as a sensitivity
      - an independent angular-frequency implementation cross-checking the shipped energy form
      - an independent Cartesian (kx, ky) quadrature cross-checking the radial k reduction
      - continuous composition profiles via native ternary_linear and imported ternary_import
      - a common 10-90 percent interface width shared by linear, fermi, erf and cosine
      - peak-referenced realized widths with a nullable nominal-referenced companion
      - a grading parameterization that is feasible by construction, with no subresolution rejection
      - a production run harness with six log streams, structured events and atomic checkpointing
      - a deterministic mock solver covering seven failure modes, marked unmistakably non-scientific
      - a licensed startup gate comparing native ternary_linear against an equivalent ternary_import
    home_syntax_check: input_generation_and_free_parser_parse_only
    home_solver_check: not_attempted_free_build_cannot_execute_imports
    licensed_validation:
      date: null
      solver: null
      evidence: >-
        None yet. Everything solver-free has been exercised on the home laptop:
        94 Demo 14 tests pass, covering the grading renderer over thousands of
        sampled geometries, the absolute chi(2) cross-checks, and a full mock
        campaign with resume and every failure mode. No licensed nextnano++ run
        has been performed, so no pm/V number produced by this demo has yet been
        computed from a real solve.
    pending_licensed_checks:
      - Run the startup gate first; it builds one linear profile natively and as an imported table and requires the two solves to agree. This is the only evidence that ternary_import does what we assume, and 24 of 30 campaign trials depend on it.
      - Run the paper-reference case (7.1/1.8/2.9 nm) and compare against 2340 / 1200 / 1363 pm/V and the ~1520 nm resonance. A disagreement is a scientific finding, not a gate failure; only a technically invalid result blocks the campaign.
