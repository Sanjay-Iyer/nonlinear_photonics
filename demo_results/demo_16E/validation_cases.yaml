demo: 16E_acqw_structure_physics_optical_comparison
purpose: Ten fixed ACQW structures compared through composition, quantum states, wavefunction
  localization and the production absolute chi2 response around 1550 nm.
total_cases: 10
deterministic: true
optimization_performed: false
random_seed: null
grading_profile: linear
grading_families_supported:
- linear
reference_case: case_01
equivalence_pair:
- case_09
- case_10
abrupt_vs_graded_pair:
- case_01
- case_02
fixed_materials:
  well: GaAs
  barrier: AlGaAs
  aluminium_fraction: 0.55
  total_gaas_well_nm: 10.0
  mesh_nm: 0.05
  target_wavelength_nm: 1550.0
abrupt_sentinel_width_nm: 0.001
