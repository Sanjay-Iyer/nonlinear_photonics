demo17_version: demo17-1.0.0
baseline_demo_id: 16E_acqw_structure_physics_optical_comparison
applied:
- id: A_well_density_Nz
  changed: chi2.nz_mode
  from: period_density
  to: well_density
  from_value_per_m: 3.3333333333333336e7
  to_value_per_m: 6.666666666666667e7
  expected_factor: 2.0
  exact: true
  source: 'Ramesh et al., APL 123, 251111 (2023) Eq. 1: "N_z is the number of quantum
    wells per unit length". arXiv:2602.23246v1 Fig. 1a shows two GaAs wells (7.1 nm,
    2.9 nm) per 30 nm period.'
- id: B_zincblende_zone_edge
  changed: k_parallel.zone_edge_convention
  from: legacy_pi_over_a
  to: crystallographic_two_pi_over_a
  from_k_max_per_nm: 0.5557143
  to_k_max_per_nm: 1.1114287
  expected_factor: null
  exact: false
  source: GaAs is zincblende (FCC). X = (1,0,0) in units of 2*pi/a, so the Gamma->X
    zone edge is 2*pi/a. pi/a is the simple-cubic edge.
- id: C_cladding_and_dirichlet_box
  changed: geometry.domain_padding_nm, geometry.quantum_region_padding_nm
  from:
  - 20.0
  - 2.0
  to:
  - 35.0
  - 30.0
  expected_factor: null
  exact: false
  source: Demo 16E recorded boundary probabilities up to 3.1e-3 against a 1.0e-3 constraint,
    with physical_qc_valid = False on all ten cases. Absolute chi(2) depends on <psi|z|psi>,
    which converges with domain size more slowly than the eigenvalues do.
